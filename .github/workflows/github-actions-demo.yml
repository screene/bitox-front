name: Deploy Bitox

on:
  push:
    branches:
      - main
concurrency:
  group: deploy-bitox-front
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/opt/bitox-front
            git fetch origin main
            git reset --hard origin/main
            npm i
            git restore package-lock.json
            npm run build
            pm2 restart bitox-front

            # Прогрев кэша: открываем все страницы из sitemap, чтобы первые посетители
            # и поисковые роботы сразу получали страницы из кэша. Ошибки не ломают деплой.
            sleep 5
            SITE=https://bitox.global
            curl -s --max-time 20 "$SITE/sitemap_index.xml" | grep -o "<loc>[^<]*" | sed "s/<loc>//" \
              | xargs -r -n1 curl -s --max-time 20 | grep -o "<loc>[^<]*" | sed "s/<loc>//" | sort -u \
              | xargs -r -P 3 -n1 curl -s -o /dev/null --max-time 30 || true
            echo "Кэш прогрет"
